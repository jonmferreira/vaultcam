name: Build APK

# Disparo manual: Actions > Build APK > Run workflow
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VAULTCAM_KEYSTORE: keystore/vaultcam-release.jks
      VAULTCAM_KEYSTORE_PASSWORD: ${{ secrets.VAULTCAM_KEYSTORE_PASSWORD }}
      VAULTCAM_KEY_ALIAS: ${{ secrets.VAULTCAM_KEY_ALIAS }}
      VAULTCAM_KEY_PASSWORD: ${{ secrets.VAULTCAM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir secrets
        env:
          KEYSTORE_B64: ${{ secrets.VAULTCAM_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for v in KEYSTORE_B64 VAULTCAM_KEYSTORE_PASSWORD VAULTCAM_KEY_ALIAS VAULTCAM_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret ausente: $v (veja docs/ASSINATURA.md)"; missing=1; fi
          done
          exit $missing

      - name: Decodificar keystore
        env:
          KEYSTORE_B64: ${{ secrets.VAULTCAM_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/vaultcam-release.jks

      - name: Compilar release assinado
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleRelease

      - name: Verificar assinatura
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Remover keystore do runner
        if: always()
        run: rm -rf keystore

      - uses: actions/upload-artifact@v4
        with:
          name: vaultcam-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
